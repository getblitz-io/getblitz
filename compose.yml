services:
  postgres:
    image: postgres:16-alpine
    container_name: getblitz-postgres
    environment:
      POSTGRES_DB: getblitz
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: getblitz-redis
    ports:
      - "6380:6379"
    command: redis-server --save 60 1
    volumes:
      - redis_data:/data

  # Self-hosted mode: Next.js with integrated WebSocket (default)
  # Usage: docker compose up app
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: getblitz-app
    environment:
      NODE_ENV: production
      PORT: 3000
      ENABLE_WEBSOCKET: "true"
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: app
      DATABASE_PASSWORD: password
      DATABASE_NAME: getblitz
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    profiles:
      - standalone

  # Split mode: Standalone WebSocket server for Vercel-compatible deployments
  # Usage: docker compose --profile split up wss
  wss:
    build:
      context: .
      dockerfile: apps/wss/Dockerfile
    container_name: getblitz-wss
    environment:
      WSS_PORT: 3001
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - redis
    profiles:
      - split

volumes:
  postgres_data:
  redis_data:
