name: Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      getblitz_client_release_created: ${{ steps.release.outputs['packages/getblitz-client--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish @getblitz/client to npm using trusted publishing (OIDC)
  publish-client:
    needs: release-please
    if: ${{ needs.release-please.outputs.getblitz_client_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org" # Required for npm publish

      - name: Install dependencies
        run: pnpm install

      - name: Build @getblitz/client
        run: pnpm -F @getblitz/client build

      - name: Publish to npm
        # No NPM_TOKEN needed - uses OIDC trusted publishing
        # Provenance is automatically generated
        run: pnpm -F @getblitz/client publish --access public

  # Sync develop to main after a release is created
  sync-main:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge develop into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge develop --ff-only
          git push origin main
