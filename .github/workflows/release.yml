name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish packages even if no new release was created"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      shared_types_release_created: ${{ steps.release.outputs['packages/shared-types--release_created'] }}
      getblitz_client_release_created: ${{ steps.release.outputs['packages/getblitz-client--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # The node-workspace plugin bumps dependent package.json ranges (e.g. the
      # client's @getblitz/shared-types) but only knows npm lockfiles. Re-sync
      # pnpm-lock.yaml on the release branch so frozen installs keep working.
      - name: Checkout release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Setup pnpm
        if: steps.release.outputs.prs_created == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Sync pnpm-lock.yaml on release PR
        if: steps.release.outputs.prs_created == 'true'
        run: |
          pnpm install --lockfile-only --ignore-scripts
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml with release versions"
          git push

  # Publish @getblitz/shared-types to npm
  publish-shared-types:
    needs: release-please
    if: |
      needs.release-please.outputs.shared_types_release_created == 'true' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_publish == 'true')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Build @getblitz/shared-types
        run: pnpm -F @getblitz/shared-types build

      - name: Publish to npm
        working-directory: packages/shared-types
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true

  # Publish @getblitz/client to npm
  publish-client:
    needs: [release-please, publish-shared-types]
    if: |
      always() &&
      (needs.release-please.outputs.getblitz_client_release_created == 'true' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_publish == 'true')) &&
      (needs.publish-shared-types.result == 'success' || needs.publish-shared-types.result == 'skipped')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Build @getblitz/client
        run: pnpm -F @getblitz/client build

      - name: Publish to npm
        working-directory: packages/getblitz-client
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true

